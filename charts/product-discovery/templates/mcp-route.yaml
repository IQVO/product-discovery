{{- if and .Values.mcp.enabled .Values.mcp.route.enabled -}}
{{- /*
MCP exposure through the Gateway API (fleet decision: the route lives in the
application chart).

Host contract: mcp.route.path (/api/mcp/product-discovery) -> Service
<release>-mcp:8090, the prefix rewritten to /mcp (the SDK's canonical endpoint
on cmd/mcp). /healthz is deliberately NOT routed: it is a Kubernetes probe
concern, not a public endpoint. No auth plugin: the endpoints are
unauthenticated by fleet-wide decision (revert of 2026-09-11).
*/ -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "product-discovery.mcpFullname" . }}
  labels:
    {{- include "product-discovery.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  parentRefs:
    {{- range .Values.mcp.route.parentRefs }}
    - name: {{ .name }}
      namespace: {{ .namespace }}
      {{- if .sectionName }}
      sectionName: {{ .sectionName }}
      {{- end }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.mcp.route.path }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /mcp
      backendRefs:
        - name: {{ include "product-discovery.mcpFullname" . }}
          port: {{ .Values.mcp.service.port }}
{{- end }}
