{{- if .Values.mcp.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "product-discovery.mcpFullname" . }}
  labels:
    {{- include "product-discovery.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  type: {{ .Values.mcp.service.type }}
  ports:
    - port: {{ .Values.mcp.service.port }}
      targetPort: {{ ternary "mcp" "http" (eq (include "product-discovery.agentsColocated" .) "true") }}
      protocol: TCP
      name: http
  # component=mcp pins the Service to the mcp Deployment's pods
  # (tests/test_service_selectors.py).
  selector:
    {{- include "product-discovery.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: {{ ternary "agents" "mcp" (eq (include "product-discovery.agentsColocated" .) "true") }}
{{- end }}
